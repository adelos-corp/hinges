<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#b8a9d4">
<meta name="application-version" content="0.0.3">
<title>Hinges 0.0.3 · Interactive Desktop</title>
<script>
    try {
      if (sessionStorage.getItem("hingesDesktopUnlocked") === "1") {
        document.documentElement.setAttribute("data-hinges-start", "home");
      }
    } catch (e) {}
  </script>
  <link rel="stylesheet" href="styles.css?v=control-centre-eight-only-1">
</head>
<body>
<main id="desktop" class="is-locked" aria-label="Hinges desktop">
  <div class="wallpaper"></div>
  <section id="lockScreen" class="lock-screen" aria-label="Hinges lock screen">
    <div class="lock-clock-block">
      <img class="lock-symbol" src="icons8-lock-25.png" alt="">
      <div id="lockDate" class="lock-date">Mon 19 Oct</div>
      <time id="lockTime" class="lock-time">09:41</time>
    </div>
    <button id="lockUnlockHint" class="lock-unlock-hint" type="button" aria-label="Swipe up or scroll to unlock">
      <span class="lock-unlock-chevron" aria-hidden="true">⌃</span>
      <span>Swipe up or scroll to unlock</span>
    </button>
  </section> <div class="desktop-icons">
    <button class="desktop-icon" data-open="Files"><img class="desktop-svg home-svg" src="icons8-house-48.png" alt=""><small>Home</small></button>
    <button class="desktop-icon" id="binIcon" data-open="Bin"><img class="desktop-svg bin-svg" src="icons8-trash-48.png" alt=""><small>Bin</small></button>
  </div>
  <section id="windowLayer" aria-live="polite"></section>

  <section id="startMenu" class="glass start-menu hidden" aria-label="Start menu">
    <form id="commandForm" class="command-form"><input id="commandInput" autocomplete="off" spellcheck="false" placeholder="Type a command or simply search" aria-label="Command bar"></form>
    <div class="app-grid" id="appGrid"></div>
    <div class="start-footer">
      <button class="mini-control" data-toggle="wifi" title="Wi-Fi">⌁</button>
      <button class="mini-control" data-toggle="bluetooth" title="Bluetooth">ᛒ</button>
      <button class="mini-control" data-toggle="sound" title="Sound">◖))</button>
      <span class="footer-spacer"></span>
      <button class="mini-control power-button" id="powerButton" title="Power">⏻</button>
    </div>
  </section>

  <section id="workspaces" class="glass workspaces hidden" aria-label="Workspaces overview">
    <header class="panel-heading"><div><span class="eyebrow">HINGES · WORKSPACES</span><h2>Mission Control</h2></div><button class="round-close" data-close="workspaces" aria-label="Close">×</button></header>
    <div class="space-tabs" id="spaceTabs"><button class="space-tab active" data-space="1">Desktop 1</button><button class="add-space" id="addSpace" aria-label="Add desktop">＋</button></div>
    <div id="workspaceCanvas" class="workspace-canvas"><div class="empty-workspace"><span>◇</span><strong>Your space, in view.</strong><small>Open an app from Start to see its window here.</small></div></div>
    <p class="workspace-hint">Drag between desktops · Select a window to return to it</p>
  </section>

  <aside id="rightPanel" class="glass right-panel control-centre-panel hidden" aria-label="Control Centre">
    <div class="quick-grid control-centre-grid">
        <button class="quick-tile" data-toggle="wifi" type="button" aria-label="Wi-Fi" title="Wi-Fi"><img class="quick-icon" src="wifi.png" alt=""></button>
        <button class="quick-tile" data-toggle="cellular" type="button" aria-label="Cellular" title="Cellular"><img class="quick-icon" src="cellularbars.png" alt=""></button>
        <button class="quick-tile" data-toggle="bluetooth" type="button" aria-label="Bluetooth" title="Bluetooth"><img class="quick-icon" src="bluetooth.png" alt=""></button>
        <button class="quick-tile" data-toggle="hotspot" type="button" aria-label="Personal Hotspot" title="Personal Hotspot"><img class="quick-icon" src="personalhotspot.png" alt=""></button>
        <button class="quick-tile" data-toggle="airplane" type="button" aria-label="Airplane mode" title="Airplane mode"><img class="quick-icon" src="aeroplanemode.png" alt=""></button>
        <button class="quick-tile" data-action="lock-screen" type="button" aria-label="Lock Screen" title="Lock Screen"><img class="quick-icon" src="lockscreen.png" alt=""></button>
        <button class="quick-tile" data-toggle="touchenabled" type="button" aria-label="Enable Touch" title="Enable Touch"><img class="quick-icon" src="enabletouch.png" alt=""></button>
        <button class="quick-tile" data-toggle="bell" type="button" aria-label="Notifications" title="Notifications"><img class="quick-icon" src="notifications.png" alt=""></button>
    </div>
  </aside>

  <header class="topbar" aria-label="System bar">
    <div class="topbar-left">
      <button class="topbar-icon control-trigger" id="controlCentreButton" aria-label="Open Control Centre" title="Control Centre">
        <img class="control-centre-icon" src="control%20centre.png" alt="" draggable="false">
      </button>
      <div id="activeControlIndicators" class="active-control-indicators" role="group" aria-label="Active controls"></div>
    </div>
    <div class="topbar-right">
      <div id="clockButton" class="clock-button" aria-label="Current date and time">
        <strong id="clockDateTime">19 Oct 14:08</strong>
      </div>
      <img id="menuBarBattery" class="menu-bar-battery" src="batteryfinal.png" alt="Battery" title="Battery">
    </div>
  </header>
  <nav class="taskbar" aria-label="Applications dock">
    <div class="taskbar-center">
      <button class="taskbar-button start-trigger" id="startButton" aria-label="Start menu" title="Start" aria-controls="startMenu" aria-expanded="false" onclick="(function(b){const m=document.getElementById('startMenu');if(!m)return;const opening=m.classList.contains('hidden');document.querySelectorAll('#rightPanel,#workspaces,#powerDialog').forEach(p=>p.classList.add('hidden'));m.classList.toggle('hidden',!opening);b.setAttribute('aria-expanded',String(opening));if(opening){const i=document.getElementById('commandInput');if(i)i.focus()}})(this)"><img src="Windows12_Gradient_Transparent.png" alt=""></button>
      <button class="taskbar-button" id="workspacesButton" aria-label="Workspaces" title="Workspaces"><img class="workspace-mark task-view-icon" src="icons8-task-view-48.png" alt=""></button>
      <button class="taskbar-button app-shortcut" data-open="Edge" title="Edge"><img class="edge-logo" src="https://commons.wikimedia.org/wiki/Special:Redirect/file/Microsoft%20Edge%20logo%20%282019%29.svg" alt=""></button>
      <button class="taskbar-button app-shortcut store-mark" data-open="Store" title="Store"><img class="store-logo" src="icons8-microsoft-store-48.png" alt=""></button>
    </div>
  </nav>
  <div id="toast" class="toast hidden" role="status"></div>
  <div id="powerDialog" class="glass power-dialog hidden"><h2>Power</h2><p>What would you like Hinges to do?</p><button data-power="sleep">☾　Sleep</button><button data-power="restart">↻　Restart demo</button><button data-power="shutdown">⏻　Shut down demo</button><button data-power="cancel">Cancel</button></div>
</main>
<script src="app.js?v=control-centre-eight-only-1"></script>
</body></html>
